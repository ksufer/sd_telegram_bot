services:
  sd-bot:
    build: .
    container_name: sd-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  sd-admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: sd-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
